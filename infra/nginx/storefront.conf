# Serves the storefront's static files. Kong sits in front, so this is only reachable through
# http://localhost:8000/.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Scripts and styles only from this origin, no inline code, and the page may not be framed.
    # The API and Keycloak are on the same origin through Kong, so 'self' covers every call.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Always fetch the latest files, so a change shows up on the next reload.
    add_header Cache-Control no-cache always;

    location / {
        try_files $uri /index.html;
    }
}
