# Kong in DB-less mode: this file is the whole gateway configuration.
# Kong routes and limits requests; each service validates the JWT itself.
_format_version: "3.0"

# Applied to every route. Limits count per client address, in this Kong only (policy local).
plugins:
  - name: rate-limiting
    config:
      second: 50
      minute: 1000
      limit_by: ip
      policy: local
  - name: request-size-limiting
    config:
      allowed_payload_size: 1
      size_unit: megabytes

services:
  - name: keycloak
    url: http://keycloak:8080
    routes:
      - name: keycloak
        # /resources serves the sign-in page's styles and scripts.
        paths: ["/realms", "/resources"]
        strip_path: false

  - name: catalog
    url: http://catalog-service:8080
    routes:
      - name: catalog
        paths: ["/products"]
        strip_path: false

  - name: inventory
    url: http://inventory-service:8080
    routes:
      - name: inventory
        paths: ["/stock"]
        strip_path: false

  - name: orders
    url: http://order-service:8080
    routes:
      - name: orders
        paths: ["/orders", "/cart", "/admin/orders"]
        strip_path: false

  # The test mailbox (Mailpit), behind its own sign-in (MAILBOX_USER in .env).
  - name: mailbox
    url: http://mailpit:8025
    routes:
      - name: mailbox
        paths: ["/mail"]
        strip_path: false

  # The browser storefront. Kong picks the longest matching path, so the API routes above win
  # and everything else is the storefront, on the same origin as the API (no CORS needed).
  - name: storefront
    url: http://storefront:80
    routes:
      - name: storefront
        paths: ["/"]
        strip_path: false
