# MyShoppingCart on one machine. Only two ports are published:
#   8000  Kong, the single entry point (storefront, API, Keycloak sign-in, test mailbox at /mail/)
#   3000  Grafana (traces, metrics, logs)
# Copy .env.example to .env before the first run.
# PostgreSQL is the postgres container by default; POSTGRES_HOST and COMPOSE_PROFILES in .env
# switch to a PostgreSQL installed on this machine (see the README).

x-service-env: &service-env
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-shop}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318

x-service: &service
  depends_on:
    databases:
      condition: service_completed_successfully
    kafka:
      condition: service_healthy

name: myshoppingcart

services:
  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      # Kong otherwise starts one worker per CPU core, about 1 GB on a laptop.
      KONG_NGINX_WORKER_PROCESSES: 1
    volumes:
      - ./infra/kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    # Production mode, with users, sessions and signing keys kept in PostgreSQL. The realm file is
    # imported only when the realm does not exist yet; later edits to it need the Keycloak
    # database dropped (see the README).
    command: start --import-realm
    depends_on:
      databases:
        condition: service_completed_successfully
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${POSTGRES_HOST:?add POSTGRES_HOST and COMPOSE_PROFILES from .env.example to .env}:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-shop}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      # TLS would end at the gateway; inside the Docker network Keycloak speaks plain HTTP to Kong.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Tokens are requested through Kong, so that is the issuer the services must see.
      KC_HOSTNAME: http://localhost:8000
      SHOP_USER: ${SHOP_USER:?copy .env.example to .env}
      SHOP_USER_PASSWORD: ${SHOP_USER_PASSWORD:?copy .env.example to .env}
      SHOP_ADMIN: ${SHOP_ADMIN:?add SHOP_ADMIN and SHOP_ADMIN_PASSWORD from .env.example to .env}
      SHOP_ADMIN_PASSWORD: ${SHOP_ADMIN_PASSWORD:?add SHOP_ADMIN and SHOP_ADMIN_PASSWORD from .env.example to .env}
    volumes:
      - ./infra/keycloak/shop-realm.json:/opt/keycloak/data/import/shop-realm.json:ro

  # Only started with the profile container-db (COMPOSE_PROFILES in .env).
  postgres:
    image: postgres:17-alpine
    profiles: ["container-db"]
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 5s
      retries: 20

  # Creates any missing service database, then exits. Runs on every start.
  databases:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
        # Not there when the databases live in a PostgreSQL outside Docker.
        required: false
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    command: ["psql", "-h", "${POSTGRES_HOST:?add POSTGRES_HOST and COMPOSE_PROFILES from .env.example to .env}", "-U", "${POSTGRES_USER:-shop}", "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/init.sql"]
    volumes:
      - ./infra/postgres/init.sql:/init.sql:ro

  # Catches every email the shop sends; read them at http://localhost:8000/mail/.
  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_WEBROOT: mail
      # Sign-in for the mailbox page and its API (not for receiving mail from notification-service).
      MP_UI_AUTH: ${MAILBOX_USER:?add MAILBOX_USER and MAILBOX_PASSWORD from .env.example to .env}:${MAILBOX_PASSWORD:?add MAILBOX_USER and MAILBOX_PASSWORD from .env.example to .env}

  # The browser storefront: a React app built into static files (storefront/Dockerfile), reached
  # through Kong at http://localhost:8000/.
  storefront:
    build: ./storefront
    volumes:
      - ./infra/nginx/storefront.conf:/etc/nginx/conf.d/default.conf:ro

  # Shopping carts. Every change is appended to a file on the volume, so carts survive restarts.
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20

  lgtm:
    image: grafana/otel-lgtm:0.11.10
    ports:
      - "3000:3000"

  catalog-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: catalog-service
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:?add POSTGRES_HOST and COMPOSE_PROFILES from .env.example to .env}:5432/catalog
      OTEL_SERVICE_NAME: catalog-service

  order-service:
    <<: *service
    depends_on:
      databases:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    build:
      context: .
      args:
        SERVICE: order-service
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:?add POSTGRES_HOST and COMPOSE_PROFILES from .env.example to .env}:5432/orders
      SPRING_DATA_REDIS_HOST: redis
      OTEL_SERVICE_NAME: order-service

  inventory-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: inventory-service
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:?add POSTGRES_HOST and COMPOSE_PROFILES from .env.example to .env}:5432/inventory
      OTEL_SERVICE_NAME: inventory-service

  notification-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: notification-service
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:?add POSTGRES_HOST and COMPOSE_PROFILES from .env.example to .env}:5432/notifications
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      OTEL_SERVICE_NAME: notification-service

  payment-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: payment-service
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:?add POSTGRES_HOST and COMPOSE_PROFILES from .env.example to .env}:5432/payments
      OTEL_SERVICE_NAME: payment-service

# Orders, payments and Kafka's topics outlive `docker compose down`; `down -v` removes them.
volumes:
  postgres-data:
  redis-data:
  kafka-data:
