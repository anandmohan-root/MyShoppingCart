# MyShoppingCart on one machine. Only two ports are published:
#   8000  Kong, the single entry point (API and Keycloak sign-in)
#   3000  Grafana (traces, metrics, logs)
# Copy .env.example to .env before the first run.

x-service-env: &service-env
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318

x-service: &service
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy

name: myshoppingcart

services:
  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      # Kong otherwise starts one worker per CPU core, about 1 GB on a laptop.
      KONG_NGINX_WORKER_PROCESSES: 1
    volumes:
      - ./infra/kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      # Tokens are requested through Kong, so that is the issuer the services must see.
      KC_HOSTNAME: http://localhost:8000
      SHOP_USER: ${SHOP_USER:?copy .env.example to .env}
      SHOP_USER_PASSWORD: ${SHOP_USER_PASSWORD:?copy .env.example to .env}
      SHOP_ADMIN: ${SHOP_ADMIN:?add SHOP_ADMIN and SHOP_ADMIN_PASSWORD from .env.example to .env}
      SHOP_ADMIN_PASSWORD: ${SHOP_ADMIN_PASSWORD:?add SHOP_ADMIN and SHOP_ADMIN_PASSWORD from .env.example to .env}
    volumes:
      - ./infra/keycloak/shop-realm.json:/opt/keycloak/data/import/shop-realm.json:ro

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 5s
      retries: 20

  # Shopping carts. Nothing else is kept here, so losing it only empties carts.
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20

  lgtm:
    image: grafana/otel-lgtm:0.11.10
    ports:
      - "3000:3000"

  catalog-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: catalog-service
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog
      OTEL_SERVICE_NAME: catalog-service

  order-service:
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    build:
      context: .
      args:
        SERVICE: order-service
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      SPRING_DATA_REDIS_HOST: redis
      OTEL_SERVICE_NAME: order-service

  inventory-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: inventory-service
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory
      OTEL_SERVICE_NAME: inventory-service

  payment-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: payment-service
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payments
      OTEL_SERVICE_NAME: payment-service

# Orders, payments and Kafka's topics outlive `docker compose down`; `down -v` removes them.
volumes:
  postgres-data:
  kafka-data:
