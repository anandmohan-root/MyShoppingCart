spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: shop
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest

# Payment decision. There is no real payment provider: a charge above this amount is declined.
payment:
  decline-above: 1000.00
