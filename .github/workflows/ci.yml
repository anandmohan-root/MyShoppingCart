name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Unit tests plus the Testcontainers integration tests (the runner has Docker).
      - run: mvn -B verify

  # The whole stack in Docker, then the API journeys (smoke.sh) and the storefront in a browser.
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - run: bash scripts/smoke.sh
      - run: bash scripts/browser-tests.sh
      - if: failure()
        run: docker compose logs --no-color --tail=200
