name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Unit tests plus the Testcontainers integration tests (the runner has Docker).
      - run: mvn -B verify

  # The whole stack in Docker, then the API journeys (smoke.sh) and the storefront in a browser.
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build
      # tee keeps the output; shell: bash adds pipefail, so a failing script still fails the step.
      - run: bash scripts/smoke.sh 2>&1 | tee smoke.log
        shell: bash
      - run: bash scripts/browser-tests.sh 2>&1 | tee browser-tests.log
        shell: bash
      # Puts the last lines of the failing script on the run's summary page, readable without opening logs.
      - if: failure()
        run: |
          for log in smoke.log browser-tests.log; do
            [ -s "$log" ] && echo "::error title=${log}::$(grep -v '^  {' "$log" | tail -6 | tr '\n' '|')"
          done
          docker compose logs --no-color --tail=200
